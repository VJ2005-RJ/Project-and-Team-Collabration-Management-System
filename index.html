<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>
<main class="split">
  <section class="brand-side">
    <div class="brand"><span class="brand-mark"></span>ProjectHub</div>
    <div>
      <h1>Keep every project, task and teammate in one place.</h1>
      <p>Team Collaboration Management System</p>
    </div>
    <span class="tag">College Project</span>
  </section>
  <section class="form-side">
    <form class="login" action="dashboard.html">
      <h2>Log in</h2>
      <p class="hint">Enter your email and password to open your dashboard.</p>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
  </section>
</main>
</body>
</html>
